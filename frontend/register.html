<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RenewGuard - Register</title>
    <link rel="stylesheet" href="css/register.css">
</head>

<body>

<div class="container">

    <div class="register-box">
        <h1>RenewGuard</h1>
        <p class="subtitle">Create your account</p>

        <form id="registerForm">

            <div class="row">
                <div class="field">
                    <label>Full Name *</label>
                    <input type="text" id="full_name" placeholder="Enter full name" required>
                </div>

                <div class="field">
                    <label>Email *</label>
                    <input type="email" id="email" placeholder="Enter email" required>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Mobile Number</label>
                    <input type="text" id="mobile" placeholder="Enter mobile number">
                </div>

                <div class="field">
                    <label>Organization</label>
                    <input type="text" id="organization" placeholder="Company / Organization">
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Department</label>
                    <input type="text" id="department" placeholder="Enter department">
                </div>

                <div class="field">
                    <label>Employee ID</label>
                    <input type="text" id="employee_id" placeholder="Enter employee ID">
                </div>
            </div>

            <div class="field">
                <label>Password *</label>
                <input type="password" id="password" placeholder="Create password" required>
            </div>

            <div class="field">
                <label>Confirm Password *</label>
                <input type="password" id="confirm_password" placeholder="Confirm password" required>
            </div>

            <label class="terms">
                <input type="checkbox" id="terms" required>
                I agree to the Terms & Conditions
            </label>

            <button type="submit">Create Account</button>

            <p id="message"></p>

            <p class="login">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </form>
    </div>

</div>

<script src="js/register.js"></script>
</body>
</html>
