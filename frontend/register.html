<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RenewGuard - Register</title>

    <link rel="stylesheet" href="css/register.css">

</head>

<body>

<div class="register-page">

    <div class="register-card">

        <!-- Logo -->
        <div class="logo">

            <div class="logo-icon">
                R
            </div>

            <div>
                <h1>RenewGuard</h1>
                <span>Management System</span>
            </div>

        </div>


        <!-- Heading -->
        <div class="register-heading">

            <h2>Create Account</h2>

            <p>
                Create your RenewGuard account
            </p>

        </div>


        <!-- Register Form -->
        <form id="registerForm">


            <!-- Name + Email -->
            <div class="row">

                <div class="field">

                    <label for="full_name">
                        Full Name *
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        placeholder="Enter full name"
                        required
                    >

                </div>


                <div class="field">

                    <label for="email">
                        Email *
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                        required
                    >

                </div>

            </div>


            <!-- Mobile + Organization -->
            <div class="row">

                <div class="field">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="text"
                        id="mobile"
                        placeholder="Enter mobile number"
                    >

                </div>


                <div class="field">

                    <label for="organization">
                        Organization
                    </label>

                    <input
                        type="text"
                        id="organization"
                        placeholder="Company / Organization"
                    >

                </div>

            </div>


            <!-- Department + Employee ID -->
            <div class="row">

                <div class="field">

                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        placeholder="Enter department"
                    >

                </div>


                <div class="field">

                    <label for="employee_id">
                        Employee ID
                    </label>

                    <input
                        type="text"
                        id="employee_id"
                        placeholder="Enter employee ID"
                    >

                </div>

            </div>


            <!-- Password -->
            <div class="field">

                <label for="password">
                    Password *
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    minlength="6"
                    required
                >

            </div>


            <!-- Confirm Password -->
            <div class="field">

                <label for="confirm_password">
                    Confirm Password *
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    placeholder="Confirm password"
                    minlength="6"
                    required
                >

            </div>


            <!-- Terms -->
            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <span>
                    I agree to the Terms & Conditions
                </span>

            </label>


            <!-- Button -->
            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>


            <!-- Message -->
            <p id="message"></p>


            <!-- Login -->
            <div class="login-link">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Login
                </a>

            </div>

        </form>

    </div>

</div>


<script src="js/register.js"></script>

</body>

</html>
