<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RenewGuard - Login</title>

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <!-- Logo -->
        <div class="logo">

            <div class="logo-icon">
                R
            </div>

            <div>
                <h1>RenewGuard</h1>
                <span>Management System</span>
            </div>

        </div>


        <!-- Heading -->
        <div class="login-heading">

            <h2>Welcome Back</h2>

            <p>
                Sign in to manage your renewals and compliance
            </p>

        </div>


        <!-- Login Form -->
        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>


            <p id="message"></p>

        </form>


        <!-- Register -->
        <div class="register-link">

            <span>
                Don't have an account?
            </span>

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>

</div>


<script src="js/login.js"></script>

</body>

</html>
