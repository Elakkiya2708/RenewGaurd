<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents - RenewGuard</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="sidebar">
    <h2>RenewGuard</h2>

    <a href="dashboard.html">Dashboard</a>
    <a href="renewals.html">Renewals</a>
    <a href="calendar.html">Calendar</a>
    <a href="history.html">History</a>
    <a class="active" href="documents.html">Documents</a>
    <a href="reports.html">Reports</a>

    <button id="logoutBtn">Logout</button>
</div>

<div class="main-content">

    <h1>Documents</h1>
    <p>Upload documents for your renewals</p>

    <div class="document-card">

        <label>Select Renewal</label>

        <select id="renewalSelect">
            <option value="">Select Renewal</option>
        </select>

        <label>Select Document</label>

        <input
            type="file"
            id="fileInput"
            accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
        >

        <button id="uploadBtn">
            Upload Document
        </button>

        <p id="message"></p>

    </div>

</div>

<script src="js/documents.js"></script>

</body>
</html>
