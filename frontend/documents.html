<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documents - RenewGuard</title>

    <link rel="stylesheet" href="css/documents.css">
</head>

<body>

    <div class="documents-page">

        <!-- Header -->
        <div class="document-header">

            <div class="brand">
                RenewGuard
            </div>

            <h1>Document Management</h1>

            <p>
                Upload and manage documents related to your renewals
            </p>

        </div>


        <!-- Upload Card -->
        <div class="upload-card">

            <div class="upload-icon">
                📄
            </div>

            <h2>Upload Document</h2>

            <p class="card-description">
                Attach important documents to your renewal record
            </p>


            <!-- Renewal Selection -->
            <div class="form-group">

                <label for="renewalSelect">
                    Select Renewal
                </label>

                <select id="renewalSelect">

                    <option value="">
                        Select a renewal
                    </option>

                </select>

            </div>


            <!-- File Selection -->
            <div class="form-group">

                <label for="fileInput">
                    Select Document
                </label>

                <div class="file-box">

                    <input
                        type="file"
                        id="fileInput"
                        accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
                    >

                    <span id="fileName">
                        Choose a file
                    </span>

                </div>

                <small>
                    PDF, DOC, DOCX, JPG or PNG • Maximum 10 MB
                </small>

            </div>


            <!-- Upload Button -->
            <button id="uploadBtn" type="button">
                Upload Document
            </button>


            <!-- Error / Loading Message -->
            <p id="message"></p>

        </div>


        <!-- Back Button -->
        <button
            class="back-btn"
            type="button"
            onclick="window.location.href='dashboard.html'"
        >
            ← Back to Dashboard
        </button>

    </div>


    <!-- SUCCESS NOTIFICATION -->

    <div
        id="successNotification"
        style="
            display: none;
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 99999;
            background: #16a34a;
            color: white;
            padding: 16px 22px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
            align-items: center;
            gap: 10px;
        "
    >

        <span
            style="
                width: 24px;
                height: 24px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                background: white;
                color: #16a34a;
                border-radius: 50%;
                margin-right: 8px;
            "
        >
            ✓
        </span>

        Document uploaded successfully!

    </div>


    <!-- JavaScript -->
    <script src="js/documents.js"></script>


    <!-- File Name -->
    <script>

        document
            .getElementById("fileInput")
            .addEventListener("change", function () {

                const fileName =
                    document.getElementById("fileName");

                if (this.files.length > 0) {

                    fileName.textContent =
                        this.files[0].name;

                } else {

                    fileName.textContent =
                        "Choose a file";
                }

            });

    </script>

</body>

</html>
