<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documents - RenewGuard</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <div class="sidebar">

        <div class="logo">
            RenewGuard
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="renewals.html">Renewals</a>
            <a href="calendar.html">Calendar</a>
            <a href="history.html">History</a>
            <a class="active" href="documents.html">Documents</a>
            <a href="reports.html">Reports</a>
        </nav>

        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>

    </div>


    <main class="main-content">

        <div class="top-bar">
            <div>
                <h1>Documents</h1>
                <p>Upload and manage renewal documents</p>
            </div>
        </div>


        <div class="document-card">

            <h2>Upload Document</h2>

            <p class="subtitle">
                Attach a document to a renewal record
            </p>

            <div class="form-group">

                <label>Select Renewal</label>

                <select id="renewalSelect">
                    <option value="">
                        Select Renewal
                    </option>
                </select>

            </div>


            <div class="form-group">

                <label>Select Document</label>

                <input
                    type="file"
                    id="fileInput"
                    accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
                >

            </div>


            <button id="uploadBtn" class="upload-btn">
                Upload Document
            </button>

            <p id="message"></p>

        </div>

    </main>


    <script src="js/documents.js"></script>

</body>
</html>
