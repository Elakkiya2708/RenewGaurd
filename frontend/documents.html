<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documents - RenewGuard</title>

    <link rel="stylesheet" href="css/documents.css">
</head>

<body>

    <div class="documents-page">

        <!-- Header -->
        <div class="document-header">

            <div class="brand">
                RenewGuard
            </div>

            <h1>Document Management</h1>

            <p>
                Upload and manage documents related to your renewals
            </p>

        </div>


        <!-- Upload Card -->
        <div class="upload-card">

            <div class="upload-icon">
                📄
            </div>

            <h2>Upload Document</h2>

            <p class="card-description">
                Attach important documents to your renewal record
            </p>


            <!-- Renewal -->
            <div class="form-group">

                <label>Select Renewal</label>

                <select id="renewalSelect">

                    <option value="">
                        Select a renewal
                    </option>

                </select>

            </div>


            <!-- File -->
            <div class="form-group">

                <label>Select Document</label>

                <div class="file-box">

                    <input
                        type="file"
                        id="fileInput"
                        accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
                    >

                    <span id="fileName">
                        Choose a file
                    </span>

                </div>

                <small>
                    PDF, DOC, DOCX, JPG or PNG • Maximum 10 MB
                </small>

            </div>


            <!-- Upload Button -->
            <button id="uploadBtn">
                Upload Document
            </button>


            <!-- Error / Status Message -->
            <p id="message"></p>

        </div>


        <!-- Back Button -->
        <button
            class="back-btn"
            onclick="window.location.href='dashboard.html'"
        >
            ← Back to Dashboard
        </button>

    </div>


    <!-- Success Notification -->
    <div id="successNotification" class="notification">

        <span class="notification-icon">
            ✓
        </span>

        <span>
            Document uploaded successfully!
        </span>

    </div>


    <script src="js/documents.js"></script>


    <!-- File Name Display -->
    <script>

        document
            .getElementById("fileInput")
            .addEventListener("change", function () {

                const fileName =
                    document.getElementById("fileName");

                if (this.files.length > 0) {

                    fileName.textContent =
                        this.files[0].name;

                } else {

                    fileName.textContent =
                        "Choose a file";
                }

            });

    </script>

</body>

</html>
