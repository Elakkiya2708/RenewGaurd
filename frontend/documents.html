<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documents - RenewGuard</title>

    <link rel="stylesheet" href="css/documents.css">
</head>

<body>

    <div class="documents-page">

        <div class="document-header">
            <div class="brand">RenewGuard</div>

            <h1>Document Management</h1>

            <p>
                Upload and manage documents related to your renewals
            </p>
        </div>


        <div class="upload-card">

            <div class="upload-icon">
                📄
            </div>

            <h2>Upload Document</h2>

            <p class="card-description">
                Attach important documents to your renewal record
            </p>


            <div class="form-group">

                <label>Select Renewal</label>

                <select id="renewalSelect">
                    <option value="">
                        Select a renewal
                    </option>
                </select>

            </div>


            <div class="form-group">

                <label>Select Document</label>

                <div class="file-box">

                    <input
                        type="file"
                        id="fileInput"
                        accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
                    >

                    <span id="fileName">
                        Choose a file
                    </span>

                </div>

                <small>
                    PDF, DOC, DOCX, JPG or PNG • Maximum 10 MB
                </small>

            </div>


            <button id="uploadBtn">
                Upload Document
            </button>

            <p id="message"></p>

        </div>


        <button class="back-btn"
            onclick="window.location.href='dashboard.html'">
            ← Back to Dashboard
        </button>

    </div>


    <script src="js/documents.js"></script>

    <script>
        document.getElementById("fileInput")
            .addEventListener("change", function () {

                const fileName =
                    document.getElementById("fileName");

                if (this.files.length > 0) {
                    fileName.textContent =
                        this.files[0].name;
                } else {
                    fileName.textContent =
                        "Choose a file";
                }
            });
    </script>

</body>
</html>
