<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RenewGuard - Add Renewal</title>
    <link rel="stylesheet" href="css/add-renewal.css">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">R</div>
            <div>
                <h2>RenewGuard</h2>
                <span>Management System</span>
            </div>
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="renewals.html" class="active">Renewals</a>
            <a href="calendar.html">Calendar</a>
            <a href="history.html">History</a>
            <a href="documents.html">Documents</a>
            <a href="reports.html">Reports</a>
        </nav>

        <button class="logout" id="logoutBtn">Logout</button>
    </aside>

    <main class="main">

        <div class="page-header">
            <div>
                <h1>Add Renewal</h1>
                <p>Create a new renewal record</p>
            </div>

            <a href="renewals.html" class="back-btn">
                ← Back
            </a>
        </div>

        <div class="form-container">

            <form id="renewalForm">

                <div class="form-grid">

                    <div class="form-group full">
                        <label>Renewal Name *</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="e.g. Microsoft 365 License"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Category *</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option>Contract</option>
                            <option>License</option>
                            <option>Certification</option>
                            <option>Warranty</option>
                            <option>Insurance</option>
                            <option>Subscription</option>
                            <option>Regulatory Permit</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Organization / Vendor</label>
                        <input
                            type="text"
                            id="organization"
                            placeholder="Organization or vendor"
                        >
                    </div>

                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" id="start_date">
                    </div>

                    <div class="form-group">
                        <label>Expiry Date *</label>
                        <input type="date" id="expiry_date" required>
                    </div>

                    <div class="form-group">
                        <label>Cost</label>
                        <input
                            type="number"
                            id="cost"
                            min="0"
                            step="0.01"
                            placeholder="0.00"
                        >
                    </div>

                    <div class="form-group">
                        <label>Priority</label>
                        <select id="priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <select id="status">
                            <option value="Pending" selected>Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Renewed">Renewed</option>
                            <option value="Expired">Expired</option>
                        </select>
                    </div>

                    <div class="form-group full">
                        <label>Notes</label>
                        <textarea
                            id="notes"
                            rows="5"
                            placeholder="Add additional notes..."
                        ></textarea>
                    </div>

                </div>

                <div id="message"></div>

                <div class="form-actions">
                    <a href="renewals.html" class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit" class="save-btn">
                        Save Renewal
                    </button>
                </div>

            </form>

        </div>

    </main>

</div>

<script src="js/add-renewal.js"></script>

</body>
</html>
